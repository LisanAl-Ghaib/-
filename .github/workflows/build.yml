name: Build debug APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Optional: without it the APK still installs, the map just renders grey.
      # Add the key under Settings -> Secrets and variables -> Actions.
      - name: Provide Maps API key
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -n "$MAPS_API_KEY" ]; then
            echo "MAPS_API_KEY=$MAPS_API_KEY" >> local.properties
            echo "Maps key: provided"
          else
            echo "Maps key: absent, falling back to local.defaults.properties"
          fi

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: traces-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
