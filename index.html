<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Дом</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'><rect x='3' y='3' width='10' height='12' fill='%23bdb5a8'/><rect x='5' y='5' width='2' height='2' fill='%23ffd98a'/><rect x='9' y='5' width='2' height='2' fill='%232a3050'/><rect x='5' y='9' width='2' height='2' fill='%232a3050'/><rect x='9' y='9' width='2' height='2' fill='%23ffd98a'/><rect x='2' y='2' width='12' height='1' fill='%238e8a84'/></svg>" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand">ДОМ <span id="address"></span></div>
        <div class="clock">
          <span id="clock-time">--:--</span>
          <span id="clock-date"></span>
        </div>
        <div id="env"></div>
        <div class="menu">
          <button id="btn-overview" title="Весь дом (Esc)">⌂ Дом</button>
          <button id="btn-panel" title="Показать или спрятать хронику" aria-label="Хроника">☰</button>
        </div>
      </header>
      <main>
        <div id="stage">
          <canvas id="view"></canvas>
          <div id="toast"></div>
          <div id="doing" hidden></div>
          <div id="zoom">
            <button id="zoom-in" title="Приблизить (+)" aria-label="Приблизить">+</button>
            <button id="zoom-out" title="Отдалить (−)" aria-label="Отдалить">−</button>
          </div>
          <div id="help">Колёсико или щипок — ближе/дальше · перетаскивание — оглядеться · клик по квартире — заглянуть · клик по человеку — проследить · кто где живёт — на стенде у почтовых ящиков</div>
          <div id="board" hidden></div>
          <div id="away" hidden></div>
        </div>
        <aside id="panel">
          <div class="panel-title">Хроника дома</div>
          <section id="tab-chronicle" class="tab active"></section>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
